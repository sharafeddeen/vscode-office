name: Spreadsheet Viewer
on:
  push:
    branches: [ahmed/main]
  pull_request:
    branches: [ahmed/main]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run package -- --out ahmed-spreadsheet-viewer.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: spreadsheet-viewer-${{ matrix.os }}
          path: ahmed-spreadsheet-viewer.vsix

  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install LibreOffice and Python UNO
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libreoffice-calc python3-uno
      - run: npm ci --no-audit --no-fund
      - name: Test native document editing and calculation
        run: npm test
        env:
          RUN_UNO: '1'
          RUN_NATIVE: '1'
          NATIVE_BACKEND: libreoffice
