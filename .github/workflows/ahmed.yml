name: Spreadsheet Viewer
on:
  push:
    branches: [ahmed/main]
  pull_request:
    branches: [ahmed/main]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run package -- --out ahmed-spreadsheet-viewer.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: spreadsheet-viewer-${{ matrix.os }}
          path: ahmed-spreadsheet-viewer.vsix
